name: Bug report
description: Something does not work the way the README says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, tokens or other secrets.
        For security problems, use the private reporting described in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the full error message or output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, starting from a fresh clone if possible.
      placeholder: |
        1. git clone ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the release tag.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version (Node / Python), package manager, Docker if relevant.
      placeholder: macOS 15, Node 24.18, pnpm 11
